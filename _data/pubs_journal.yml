  abstract: Recent advancements in lunar positioning, navigation, and timing have
    demonstrated that global navigation satellite system (GNSS) signals, including
    weak side-lobe transmissions, can be exploited for lunar spacecraft positioning
    and timing. Although GNSS-based navigation on the Moon has been recently validated,
    unmodeled ionospheric and plasmaspheric delays remain a significant source of
    error, particularly given the unique signal geometry and extended propagation
    paths. This paper characterizes these delays using the Global Core Plasma Model
    and a custom low-cost ray-tracing algorithm that iteratively solves for bent signal
    paths. We simulate first-, second-, and third-order group delays, as well as excess
    path length from ray bending, for GNSS signals received at both lunar orbit and
    the lunar south pole under varying solar and geomagnetic conditions. Results show
    that mean group delays are typically on the order of meters, but can exceed 100
    m for rays passing through high-electron-density regions (altitudes below 1000
    km with respect to Earth) during high solar activity. We also show that bending
    delays are generally smaller but non-negligible when the ray passes through high-electron-density
    regions in the ionosphere. In addition, we quantify the influence of signal frequency,
    geomagnetic K p index, and solar R12 index. These results provide quantitative
    insight into the magnitude and variability of ionospheric and plasmaspheric delays
    for Earth-Moon GNSS signal paths and help characterize measurement errors affecting
    GNSS-based navigation at lunar receivers.
