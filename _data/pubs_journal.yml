  abstract: This article presents almanac and ephemeris message representation for
    lunar navigation satellites supporting the Lunar Augmented Navigation System.
    The proposed method combines osculating orbital elements, Chebyshev polynomials,
    and Fourier series to efficiently represent lunar satellite trajectories subject
    to complex perturbations from lunar gravity and third-body effects. For the ephemeris,
    a hybrid Chebyshev–Fourier formulation improves fitting accuracy over long arcs
    while maintaining message compactness under the datasize constraint of the LunaNet
    Interoperability Specification. For the almanac, a compact low-order polynomial
    and Fourier model is introduced to capture mid-term orbital variations over a
    15-day fitting arc. The approach is validated for multiple orbit regimes, including
    30-, 24-, and 13.2-h elliptical Lunar frozen orbits and a 6-h polar orbit. Results
    show that the proposed framework achieves submeter position and sub-millimeter-per-second
    velocity fitting errors within the 900-bit limit for 6-h ephemeris arcs and almanac
    fitting accuracy sufficient for reliable satellite visibility identification in
    warm-start operations.
