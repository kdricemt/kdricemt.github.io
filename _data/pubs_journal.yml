  title: Precise Positioning and Timekeeping in a Lunar Orbit via Terrestrial GPS
    Time-Differenced Carrier-Phase Measurements
  journal: 'NAVIGATION: Journal of the Institute of Navigation'
  year: '2024'
  year_num: 2024
  pdf: ''
  video: ''
